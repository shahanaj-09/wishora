<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - Wishora</title>

<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<section class="section-container" style="padding:80px 0;">

<div class="section-heading">
<span class="section-label">CHECKOUT</span>
<h2>Place Your <em>Order</em></h2>
</div>

<div style="max-width:600px;margin:auto;">

<input type="text" id="name"
placeholder="Enter Your Name"
style="width:100%;padding:15px;margin:10px 0;">

<input type="tel" id="phone"
placeholder="Enter Phone Number"
style="width:100%;padding:15px;margin:10px 0;">

<textarea id="address"
placeholder="Enter Address"
style="width:100%;padding:15px;margin:10px 0;height:120px;"></textarea>

<button
class="primary-button"
onclick="placeOrder()">
Place Order via WhatsApp
</button>

</div>

</section>

<script>
    const product =
    localStorage.getItem("productName");
    const price =
    localStorage.getItem("price");


function placeOrder() {

    const name =
        document.getElementById("name").value;

    const phone =
        document.getElementById("phone").value;

    const address =
        document.getElementById("address").value;

    if (!name || !phone || !address) {

        alert("Please fill all fields");

        return;
    }

    const shopNumber =
        "919876543210"; // change to actual WhatsApp number

    const message =
`🌸 New Wishora Order

Name: ${name}
Phone: ${phone}
Address: ${address}

Product: Luxury Gift Box
Price: ₹1499`;

    window.open(
        `https://wa.me/${shopNumber}?text=${encodeURIComponent(message)}`,
        "_blank"
    );
}

</script>

</body>
</html>
